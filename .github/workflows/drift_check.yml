name: Deploy Serverless Application

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-west-2" # Or your desired default region
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Lambda packages
        run: |
          # Package for drift_detector
          mkdir -p package_drift
          cp scripts/drift_detector.py package_drift/
          cp -r terraform package_drift/
          pip install -r requirements.txt -t package_drift/
          cd package_drift && zip -r ../drift_detector.zip . && cd ..

          # Package for hello_world
          echo 'def handler(event, context): return {"statusCode": 200, "body": "Hello, World!"}' > hello_world.py
          zip hello_world.zip hello_world.py
        working-directory: .

      - name: Move Lambda packages to Terraform directory
        run: |
          mv drift_detector.zip terraform/
          mv hello_world.zip terraform/

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform
